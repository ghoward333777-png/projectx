name: QueryBook (one window)

on:
  push:
    paths: ["querybook-one/**", ".github/workflows/querybook-one.yml"]
  pull_request:
    paths: ["querybook-one/**", ".github/workflows/querybook-one.yml"]
  workflow_dispatch:

jobs:
  lean:
    name: Lean 4 proofs (Mathlib)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: querybook-one/lean
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Fetch Mathlib's prebuilt files
        run: lake exe cache get
      - name: Check every proof
        run: lake build

  windows-bundle:
    name: QueryBook.zip on Windows (Python inside, no install)
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build QueryBook.zip (downloads python.org's embeddable Python, checks its SHA-256)
        working-directory: querybook-one
        run: python tools/build_bundle.py
      - name: Unzip it like a user would; point the data folder at a test folder
        run: |
          Expand-Archive querybook-one/dist/QueryBook.zip -DestinationPath $env:RUNNER_TEMP\user
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\QB" | Out-Null
          Set-Content -Path "$env:RUNNER_TEMP\user\QueryBook\data-folder.txt" -Value "$env:RUNNER_TEMP\QB"
      - name: Start everything with the bundled Python only, then ask a question
        run: |
          $env:PATH = "C:\Windows\System32;C:\Windows"
          $app = "$env:RUNNER_TEMP\user\QueryBook"
          $p = Start-Process -FilePath "$app\python\python.exe" -ArgumentList @("-X", "utf8", "$app\QueryBook-Shell\shell.py", "--no-browser") -PassThru -RedirectStandardOutput "$env:RUNNER_TEMP\shell.log" -RedirectStandardError "$env:RUNNER_TEMP\shell.err"
          $ok = $false
          for ($i = 0; $i -lt 60; $i++) {
            Start-Sleep -Seconds 3
            try {
              $s = Invoke-RestMethod http://127.0.0.1:8090/api/shell/status
              $states = ($s.programs | ForEach-Object { "$($_.id)=$($_.state)" }) -join " "
              Write-Host $states
              if (($s.programs | Where-Object { $_.state -ne "running" }).Count -eq 0) { $ok = $true; break }
            } catch { Write-Host "waiting for the shell…" }
          }
          if (-not $ok) { Get-Content "$env:RUNNER_TEMP\shell.log", "$env:RUNNER_TEMP\shell.err"; $s.programs | ForEach-Object { $_.output }; throw "not every application started" }
          $a = Invoke-RestMethod "http://127.0.0.1:8090/api/shell/ask?q=obsequious"
          Write-Host "Ask: $($a.short)"
          if (-not ($a.short -match "fawning|obedient")) { throw "Ask did not answer from the Language Builder" }
          $m = Invoke-RestMethod "http://127.0.0.1:8090/api/shell/ask?q=60%20mph%20to%20km/h"
          Write-Host "Ask: $($m.short)"
          if (-not ($m.short -match "96.56064")) { throw "Ask did not answer from STEM" }
          Get-ChildItem "$env:RUNNER_TEMP\QB" | ForEach-Object { Write-Host "data folder: $($_.Name)" }
          Stop-Process -Id $p.Id -Force
      - uses: actions/upload-artifact@v4
        with:
          name: QueryBook-windows
          path: querybook-one/dist/QueryBook.zip

  windows-harvest:
    # The user's report: harvesting runs about a minute, then stops. Reproduced as the user runs it: QueryBook.zip,
    # the bundled Python only, one window, Start pressed in the Control Panel — then watched for 6 minutes.
    name: Harvesting keeps going on Windows (QueryBook.zip, 25 min, no stalls, no falls)
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build and unzip QueryBook.zip
        run: |
          python querybook-one/tools/build_bundle.py
          Expand-Archive querybook-one/dist/QueryBook.zip -DestinationPath $env:RUNNER_TEMP\user
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\QB" | Out-Null
          Set-Content -Path "$env:RUNNER_TEMP\user\QueryBook\data-folder.txt" -Value "$env:RUNNER_TEMP\QB"
          Get-PSDrive -PSProvider FileSystem | Format-Table Name, @{n="FreeGB";e={[math]::Round($_.Free/1GB,1)}}
      - name: Start QueryBook, press Start harvesting, watch for 25 minutes
        run: |
          $app = "$env:RUNNER_TEMP\user\QueryBook"
          $p = Start-Process -FilePath "$app\python\python.exe" -ArgumentList @("-X", "utf8", "$app\QueryBook-Shell\shell.py", "--no-browser") -PassThru -RedirectStandardOutput "$env:RUNNER_TEMP\shell.log" -RedirectStandardError "$env:RUNNER_TEMP\shell.err"
          for ($i = 0; $i -lt 60; $i++) {
            Start-Sleep -Seconds 3
            try { $s = Invoke-RestMethod http://127.0.0.1:8090/api/shell/status; if (($s.programs | Where-Object { $_.state -ne "running" }).Count -eq 0) { break } } catch { }
          }
          $s.programs | ForEach-Object { Write-Host "$($_.id) $($_.state) $($_.url)" }
          python querybook-one/tools/harvest_watch.py --start --minutes 25 --every 30 --max-still 10 --data "$env:RUNNER_TEMP\QB"
          $code = $LASTEXITCODE
          Write-Host "--- python processes"; Get-CimInstance Win32_Process -Filter "Name='python.exe'" | ForEach-Object { Write-Host $_.ProcessId $_.CommandLine.Substring(0, [math]::Min(220, $_.CommandLine.Length)) }
          Write-Host "--- shell status"; (Invoke-RestMethod http://127.0.0.1:8090/api/shell/status).programs | ForEach-Object { Write-Host $_.id $_.state; $_.output }
          Get-ChildItem -Recurse "$env:RUNNER_TEMP\QB" -Filter "*.jsonl" | Sort-Object LastWriteTime | Select-Object -Last 6 | ForEach-Object { Write-Host "--- $($_.FullName)"; Get-Content $_.FullName -Tail 15 }
          Stop-Process -Id $p.Id -Force
          exit $code

  windows-farm:
    # Farm out, as the user would: QueryBook.zip on the server, a dataset given to this PC by name and IP, its Windows
    # harvester downloaded (Python inside) and started with only that Python, sealed facts backed up to a "drive",
    # imported on the server — every count checked, and no fact text in a sealed file.
    name: Farm-out harvester on Windows (QueryBook.zip -> harvester -> drive -> import)
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build and unzip QueryBook.zip
        run: |
          python querybook-one/tools/build_bundle.py
          Expand-Archive querybook-one/dist/QueryBook.zip -DestinationPath $env:RUNNER_TEMP\user
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\QB" | Out-Null
          Set-Content -Path "$env:RUNNER_TEMP\user\QueryBook\data-folder.txt" -Value "$env:RUNNER_TEMP\QB"
      - name: Server, harvester, drive, import
        run: |
          $app = "$env:RUNNER_TEMP\user\QueryBook"
          $p = Start-Process -FilePath "$app\python\python.exe" -ArgumentList @("-X", "utf8", "$app\QueryBook-Shell\shell.py", "--no-browser") -PassThru -RedirectStandardOutput "$env:RUNNER_TEMP\shell.log" -RedirectStandardError "$env:RUNNER_TEMP\shell.err"
          for ($i = 0; $i -lt 60; $i++) {
            Start-Sleep -Seconds 3
            try { $s = Invoke-RestMethod http://127.0.0.1:8090/api/shell/status; if (($s.programs | Where-Object { $_.state -ne "running" }).Count -eq 0) { break } } catch { }
          }
          python querybook-one/tools/farm_e2e.py --panel http://127.0.0.1:8100 --work "$env:RUNNER_TEMP\farm" --dataset calendar-scaffold --os windows
          $code = $LASTEXITCODE
          if ($code -ne 0 -and (Test-Path "$env:RUNNER_TEMP\farm\harvester.log")) { Get-Content "$env:RUNNER_TEMP\farm\harvester.log" -Tail 40 }
          Stop-Process -Id $p.Id -Force
          exit $code

  rust:
    name: Rust port (matches the Python exactly)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: querybook-one/rust/qbcore
    steps:
      - uses: actions/checkout@v4
      - run: cargo test --release

  suite:
    name: Suite tests on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    defaults:
      run:
        working-directory: querybook-one
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ffmpeg and espeak-ng (the video and speech tests use them; Windows uses the bundled espeak)
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg espeak-ng; fi
          if [ "$RUNNER_OS" = "macOS" ]; then brew install ffmpeg espeak-ng; fi
          if [ "$RUNNER_OS" = "Windows" ]; then choco install ffmpeg -y --no-progress; fi
      - name: Shell and Lean-sync tests
        run: python -m unittest discover -s tests -t . -v
      - name: Every application's self-test
        working-directory: querybook-one/apps
        run: python -B tools/run_all_tests.py

  speech-probe:
    # Report only (never fails the build): changes one thing at a time — voice name, voice option, sentence, speed,
    # server concurrency, pieces at once, recording length — and tabulates which change moves the outcome.
    name: Speech probe on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    defaults:
      run:
        working-directory: querybook-one
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install espeak-ng (Windows uses the bundled copy)
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then sudo apt-get update -qq && sudo apt-get install -y -qq espeak-ng; fi
          if [ "$RUNNER_OS" = "macOS" ]; then brew install espeak-ng; fi
      - name: Probe
        env:
          PYTHONUTF8: "1"
        run: python -B tools/speech_probe.py all
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: speech-probe-${{ matrix.os }}
          path: querybook-one/speech-probe.json
