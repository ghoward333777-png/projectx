name: VeriWave

on:
  push:
    paths: ["veriwave/**", "querybook-one/apps/shell/**", "docs/querybook-rebuild/**", ".github/workflows/veriwave.yml"]
  pull_request:
    paths: ["veriwave/**", "querybook-one/apps/shell/**", "docs/querybook-rebuild/**", ".github/workflows/veriwave.yml"]
  workflow_dispatch:

jobs:
  lean:
    name: Lean 4 (every function's embedded Lean, theorems and #guard vectors)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: veriwave
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: The extracted Lean matches the Python
        run: python tools/gen_lean.py --check
      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Check every proof and vector
        working-directory: veriwave/lean
        run: lake build

  rust:
    name: Rust port equals the Python
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: veriwave/rust/vwcore
    steps:
      - uses: actions/checkout@v4
      - run: cargo test --release

  python:
    name: Python tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: veriwave
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m unittest discover -s tests -t .
