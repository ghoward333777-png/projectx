name: QueryBook Translate

on:
  push:
    paths: ['translate/**', 'tests/translate-admin-contract.php', '.github/workflows/translate.yml']
  pull_request:
    paths: ['translate/**', 'tests/translate-admin-contract.php', '.github/workflows/translate.yml']
  workflow_dispatch:

jobs:
  engine:
    name: Engine, packs and admin tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: zip
      - run: node translate/tools/build-packs.mjs --check
      - run: node --test translate/tests/*.test.mjs
      - run: for t in tests/*.php; do php "$t"; done

  android:
    name: Android APK (phones and tablets)
    needs: engine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Build debug APK (internal sideloading)
        working-directory: translate/native/android
        # The Ubuntu runner ships the Android SDK; AGP installs any missing platform it needs.
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: QueryBookTranslate-android
          path: translate/native/android/app/build/outputs/apk/debug/app-debug.apk

  ios:
    name: iPhone and iPad build (simulator, unsigned)
    needs: engine
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build universal app for the simulator
        working-directory: translate/native/ios
        run: |
          xcodebuild -project QueryBookTranslate.xcodeproj -target QueryBookTranslate \
            -sdk iphonesimulator -configuration Debug CODE_SIGNING_ALLOWED=NO build
      - name: Package .app
        working-directory: translate/native/ios/build/Debug-iphonesimulator
        run: zip -qr QueryBookTranslate-simulator.zip QueryBookTranslate.app
      - uses: actions/upload-artifact@v4
        with:
          name: QueryBookTranslate-ios-simulator
          path: translate/native/ios/build/Debug-iphonesimulator/QueryBookTranslate-simulator.zip
