MOD_WATCHROOM_FIELD_COMPACT="Compact"
MOD_WATCHROOM_FIELD_HEIGHT="Height"
MOD_WATCHROOM_FIELD_HEIGHT_DESC="CSS height such as 480px. Empty keeps a 16:9 box."
MOD_WATCHROOM_FIELD_DAYS="Keep idle rooms for (days)"
MOD_WATCHROOM_FIELD_BASE="Player URL (advanced)"
MOD_WATCHROOM_FIELD_BASE_DESC="Only when the player is hosted elsewhere; that deployment must allow this site in WATCHROOM_CORS_ORIGINS."
