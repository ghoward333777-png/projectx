<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QueryBook</title>
<link rel="stylesheet" href="shell.css">
</head>
<body>
<header class="bar">
  <span class="brand">QueryBook <span class="ver" id="qbver"></span></span>
  <button type="button" class="hvpill" id="hvpill" hidden title="Harvesting"></button>
  <form id="askform" class="askbox" role="search">
    <input id="askinput" type="search" autocomplete="off" placeholder="Ask anything — a word, a fact, a calculation (more ways to ask on the Ask page)" aria-label="Ask QueryBook">
    <button type="submit">Ask</button>
    <div id="asksuggest" class="asksuggest" hidden aria-live="polite"></div>
  </form>
  <div class="roles" id="roles" role="group" aria-label="Show areas for"></div>
</header>
<div class="frame">
  <nav class="rail" id="rail" aria-label="Areas"></nav>
  <main id="pane"></main>
</div>
<script src="askpage.js"></script>
<script src="bookquery.js"></script>
<script src="capspage.js"></script>
<script src="shell.js"></script>
</body>
</html>
