[package]
name = "mms-server"
description = "MediaMarketplace Studio server: admin, storefront embeds, API and background jobs"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "mms-server"
path = "src/main.rs"

[dependencies]
mms-core = { path = "../mms-core" }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
chrono.workspace = true
sqlx.workspace = true
axum = { version = "0.7", features = ["macros", "form", "query"] }
tower-http = { version = "0.5", features = ["trace", "set-header"] }
tower = { version = "0.4", features = ["util"] }
axum-extra = { version = "0.9", features = ["cookie"] }
minijinja = { version = "2", features = ["loader"] }
clap = { version = "4", features = ["derive", "env"] }
rpassword = "7"
rand.workspace = true
hmac.workspace = true
sha2.workspace = true
uuid.workspace = true
time = "0.3"

[dev-dependencies]
http-body-util = "0.1"
