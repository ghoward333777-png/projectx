{% extends "base.html" %}
{% block title %}Set up{% endblock %}
{% block body %}
<section class="card narrow">
  <h1>Welcome to MediaMarketplace Studio</h1>
  <p>Create the first administrator account. You can add more people later.</p>
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  <form method="post" action="{{ base }}/setup">
    <label>Name <input name="name" required autocomplete="name"></label>
    <label>Email <input name="email" type="email" required autocomplete="username"></label>
    <label>Password (10+ characters) <input name="password" type="password" required minlength="10" autocomplete="new-password"></label>
    <label>Repeat password <input name="password_repeat" type="password" required minlength="10" autocomplete="new-password"></label>
    <button class="primary">Create administrator</button>
  </form>
</section>
{% endblock %}
