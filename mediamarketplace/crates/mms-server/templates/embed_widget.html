<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ name }} · {{ site_name }}</title>
<link rel="stylesheet" href="{{ base }}/static/mms.css">
<style>{{ css }}</style>
</head>
<body class="embed">
{{ html }}
<script src="{{ base }}/static/mms-player.js" defer></script>
<script src="{{ base }}/static/mms-widget.js" defer></script>
<script>
(function () { function report() { parent.postMessage({ mms: 'resize', height: document.documentElement.scrollHeight }, '*'); }
  window.addEventListener('load', report); window.addEventListener('resize', report); new MutationObserver(report).observe(document.body, { childList: true, subtree: true, attributes: true }); })();
</script>
</body>
</html>
