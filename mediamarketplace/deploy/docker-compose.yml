services:
  mms:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: mms-server:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8090:8090"
    environment:
      MMS_PUBLIC_URL: "https://media.example.com"
    volumes:
      - mms-data:/var/lib/mms
volumes:
  mms-data:
