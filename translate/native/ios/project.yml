# Alternative to the checked-in .xcodeproj: `brew install xcodegen && xcodegen` regenerates it.
name: QueryBookTranslate
options:
  bundleIdPrefix: com.querybook
  deploymentTarget:
    iOS: "16.0"
targets:
  QueryBookTranslate:
    type: application
    platform: iOS
    sources:
      - path: QueryBookTranslate
        excludes: [www]
      - path: QueryBookTranslate/www
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.querybook.translate
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 1
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        INFOPLIST_KEY_CFBundleDisplayName: Translate
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Your speech is captured to translate it. With on-device recognition it never leaves the device.
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: Speech is turned into text on this device so it can be translated. You confirm the text before it is trusted.
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    preBuildScripts:
      - name: Bundle web app
        script: |
          WEB="${SRCROOT}/../.."
          DEST="${SRCROOT}/QueryBookTranslate/www"
          if [ -f "$WEB/index.html" ]; then
            mkdir -p "$DEST"
            rsync -a --delete --exclude 'packs/src' --exclude 'native' --exclude 'admin' --exclude 'store' --exclude 'tests' --exclude 'tools' --exclude 'sw.js' --include '*/' --include '*.html' --include '*.css' --include '*.js' --include '*.json' --include '*.webmanifest' --include '*.png' --include '*.svg' --exclude '*' "$WEB/" "$DEST/"
          fi
