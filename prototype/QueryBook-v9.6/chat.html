<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>QueryBook Chat</title>
<style>
  :root{
    --bg:#f5f6f8; --panel:#ffffff; --ink:#16202c; --muted:#5c6b7a; --line:#e2e7ee;
    --accent:#1f6feb; --verified:#1a7f4b; --contra:#b25d00; --unknown:#8a3b3b;
    --chip:#eef2f7; --user:#1f6feb; --userink:#ffffff;
    color-scheme:light;
  }
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    --bg:#0e141b; --panel:#141c26; --ink:#e6edf3; --muted:#93a2b3; --line:#243040;
    --accent:#4d9bff; --verified:#41c98a; --contra:#e0913f; --unknown:#e07a7a;
    --chip:#1b2530; --user:#2b6fd6; --userink:#ffffff; color-scheme:dark;
  }}
  :root[data-theme="dark"]{
    --bg:#0e141b; --panel:#141c26; --ink:#e6edf3; --muted:#93a2b3; --line:#243040;
    --accent:#4d9bff; --verified:#41c98a; --contra:#e0913f; --unknown:#e07a7a;
    --chip:#1b2530; --user:#2b6fd6; --userink:#ffffff; color-scheme:dark;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);
       font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
       display:flex;flex-direction:column}
  header{padding:14px 18px;border-bottom:1px solid var(--line);background:var(--panel);
         display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  header h1{font-size:16px;margin:0;letter-spacing:.2px}
  header .tag{font-size:11px;color:var(--muted);border:1px solid var(--line);
              border-radius:999px;padding:2px 9px;text-transform:uppercase;letter-spacing:.6px}
  #llm{margin-left:auto;font-size:12px;color:var(--muted)}
  #log{flex:1;overflow-y:auto;padding:18px;max-width:820px;width:100%;margin:0 auto}
  .row{display:flex;margin:10px 0}
  .row.me{justify-content:flex-end}
  .bubble{max-width:88%;padding:11px 14px;border-radius:14px;border:1px solid var(--line);
          background:var(--panel);white-space:pre-wrap;word-wrap:break-word}
  .me .bubble{background:var(--user);color:var(--userink);border-color:transparent}
  .verdict{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.7px;
           text-transform:uppercase;margin-bottom:6px}
  .v-VERIFIED{color:var(--verified)} .v-CONTRADICTED{color:var(--contra)} .v-UNKNOWN{color:var(--unknown)}
  .cites{margin-top:9px;border-top:1px dashed var(--line);padding-top:8px;font-size:12.5px}
  .cite{display:flex;gap:8px;align-items:baseline;color:var(--muted);margin:3px 0;
        font-variant-numeric:tabular-nums}
  .cite b{color:var(--ink);font-weight:600}
  .cite .fp{font-family:ui-monospace,Consolas,monospace;font-size:11px;opacity:.7}
  .cite .t{margin-left:auto;font-family:ui-monospace,Consolas,monospace}
  .rph{margin-top:7px;font-family:ui-monospace,Consolas,monospace;font-size:10.5px;
       color:var(--muted);word-break:break-all}
  .flags{margin-top:7px;font-size:12px;color:var(--unknown)}
  footer{border-top:1px solid var(--line);background:var(--panel);padding:12px;
         padding-bottom:calc(12px + env(safe-area-inset-bottom,0px))}
  form{display:flex;gap:8px;max-width:820px;margin:0 auto}
  input[type=text]{flex:1;padding:11px 13px;border:1px solid var(--line);border-radius:10px;
                   background:var(--bg);color:var(--ink);font-size:15px}
  button{padding:11px 18px;border:0;border-radius:10px;background:var(--accent);color:#fff;
         font-weight:600;cursor:pointer;font-size:15px}
  button:disabled{opacity:.5;cursor:default}
  .hint{max-width:820px;margin:8px auto 0;font-size:12px;color:var(--muted);display:flex;
        gap:6px;flex-wrap:wrap}
  .hint b{color:var(--muted);font-weight:600;width:100%}
  .ex{border:1px solid var(--line);border-radius:999px;padding:3px 10px;cursor:pointer;background:var(--chip)}
  .menu{display:flex;gap:4px;flex-wrap:wrap;margin-left:8px}
  .mi{font-size:13px;text-decoration:none;color:var(--muted);padding:5px 11px;border-radius:8px;border:1px solid transparent}
  .mi:hover{color:var(--ink);background:var(--chip)}
  .mi.active{color:var(--userink);background:var(--accent)}
</style>
</head>
<body>
<header>
  <h1>QueryBook</h1>
  <nav class="menu">
    <a class="mi active" href="/">Chat</a>
    <a class="mi" href="dashboard">Live status</a>
    <a class="mi" href="language">Language Lab</a>
    <a class="mi" href="guide">Guide</a>
  </nav>
  <span id="llm">checking…</span>
</header>

<div id="log">
  <div class="row"><div class="bubble">Ask a question. I answer <b>only</b> from verified Fact Units in
this store — with citations and a provenance hash. No fact, no answer.</div></div>
</div>

<footer>
  <form id="f">
    <input id="q" type="text" autocomplete="off" placeholder="Ask QueryBook…" autofocus>
    <button id="send" type="submit">Ask</button>
  </form>
  <div class="hint"><b>Try:</b>
    <span class="ex">What is the capital of France?</span>
    <span class="ex">How tall is Everest?</span>
    <span class="ex">Who was the first person on Mars?</span>
  </div>
</footer>

<script>
const log=document.getElementById('log'), f=document.getElementById('f'),
      q=document.getElementById('q'), send=document.getElementById('send'),
      llm=document.getElementById('llm');
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

fetch('api/stats').then(r=>r.json()).then(s=>{
  llm.textContent=(s.facts||0).toLocaleString()+' facts in store';
}).catch(()=>{llm.textContent='store offline';});

function add(cls,html){const r=document.createElement('div');r.className='row '+cls;
  r.innerHTML='<div class="bubble">'+html+'</div>';log.appendChild(r);log.scrollTop=log.scrollHeight;return r;}

function render(res){
  let h='<span class="verdict v-'+esc(res.verdict)+'">'+esc(res.verdict)
      +(res.grounded?'':' · deterministic')+'</span>\n'+esc(res.answer);
  if(res.citations&&res.citations.length){
    h+='<div class="cites">';
    for(const c of res.citations)
      h+='<div class="cite"><span>['+c.n+']</span> <b>'+esc(c.subject)+'</b> '
        +esc(c.predicate)+' '+esc(c.object)
        +' <span class="fp">'+esc((c.fingerprint||'').slice(0,12))+'…</span>'
        +'<span class="t">trust '+Number(c.trust).toFixed(2)+'</span></div>';
    h+='</div>';
  }
  if(res.unsupported_flags&&res.unsupported_flags.length)
    h+='<div class="flags">⚠ post-check removed/flagged '+res.unsupported_flags.length
      +' unsupported claim(s)</div>';
  if(res.llm_error)
    h+='<div class="flags">ℹ LLM layer unavailable ('+esc(res.llm_error)+') — answered deterministically straight from the facts. The answer is still correct and cited.</div>';
  if(res.response_provenance_hash)
    h+='<div class="rph">RPH '+esc(res.response_provenance_hash)+'</div>';
  return h;
}

async function ask(text){
  add('me',esc(text));
  const thinking=add('','<i>querying the fact store…</i>');
  send.disabled=true;
  try{
    const r=await fetch('api/chat',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({question:text})});
    const res=await r.json();
    thinking.querySelector('.bubble').innerHTML = r.ok ? render(res)
      : '<span class="v-UNKNOWN">error</span>\n'+esc(res.error||('HTTP '+r.status));
  }catch(e){ thinking.querySelector('.bubble').textContent='network error: '+e; }
  send.disabled=false; q.focus(); log.scrollTop=log.scrollHeight;
}

f.addEventListener('submit',e=>{e.preventDefault();const t=q.value.trim();if(!t)return;q.value='';ask(t);});
document.querySelectorAll('.ex').forEach(el=>el.addEventListener('click',()=>{q.value=el.textContent;ask(el.textContent);}));
</script>
</body>
</html>
