<svg xmlns="http://www.w3.org/2000/svg" width="940" height="650" viewBox="0 0 940 650" font-family="Arial, Helvetica, sans-serif"><rect width="940" height="650" fill="#ffffff"/><defs><marker id="ah" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 Z" fill="#000"/></marker></defs><text x="470.0" y="26" text-anchor="middle" font-size="15" font-weight="bold">DETERMINISTIC MULTI-LANGUAGE REGENERATION</text><rect x="70" y="150" width="190" height="80" rx="4" fill="#ffffff" stroke="#000" stroke-width="1.6"/><text x="165.0" y="184.0" text-anchor="middle" font-size="11" font-weight="bold" dominant-baseline="middle">SOURCE CONTENT</text><text x="165.0" y="200.0" text-anchor="middle" font-size="10.5">ingested once (1500)</text><rect x="350.0" y="130" width="240" height="120" rx="4" fill="#ffffff" stroke="#000" stroke-width="1.6"/><text x="470.0" y="184.0" text-anchor="middle" font-size="11" font-weight="bold" dominant-baseline="middle">FACT UNIT GRAPH</text><text x="470.0" y="200.0" text-anchor="middle" font-size="10.5">language-independent</text><text x="470.0" y="213.0" text-anchor="middle" font-size="10.5">single knowledge source (1502)</text><line x1="260" y1="190" x2="350.0" y2="190" stroke="#000" stroke-width="1.5" marker-end="url(#ah)"/><text x="785" y="96" text-anchor="middle" font-size="10.5">TARGET LANGUAGES (1504)</text><rect x="690" y="110" width="190" height="52" rx="4" fill="#ffffff" stroke="#000" stroke-width="1.6"/><text x="785.0" y="130.0" text-anchor="middle" font-size="11" font-weight="bold" dominant-baseline="middle">English</text><text x="785.0" y="146.0" text-anchor="middle" font-size="10.5">regenerated on demand</text><text x="664" y="136" font-size="12" font-style="italic" font-weight="bold">1504a</text><line x1="590.0" y1="190" x2="690" y2="136" stroke="#000" stroke-width="1.5" marker-end="url(#ah)"/><rect x="690" y="180" width="190" height="52" rx="4" fill="#ffffff" stroke="#000" stroke-width="1.6"/><text x="