<svg xmlns="http://www.w3.org/2000/svg" width="940" height="650" viewBox="0 0 940 650" font-family="Arial, Helvetica, sans-serif"><rect width="940" height="650" fill="#ffffff"/><defs><marker id="ah" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 Z" fill="#000"/></marker></defs><text x="470.0" y="26" text-anchor="middle" font-size="15" font-weight="bold">FACT UNIT — ATOM, ENVELOPE, AND CONTENT-DERIVED IDENTITY</text><rect x="60" y="60" width="820" height="500" rx="10" fill="#f7f9fc" stroke="#000" stroke-width="2"/><text x="78" y="84" text-anchor="start" font-size="12" font-weight="bold">FACT ENVELOPE (200)</text><rect x="90" y="100" width="300" height="96" rx="4" fill="#ffffff" stroke="#000" stroke-width="1.6"/><text x="240.0" y="148.0" text-anchor="middle" font-size="12" font-weight="bold" dominant-baseline="middle">NUCLEUS (202)</text><rect x="104" y="134" width="272" height="15" fill="#fff" stroke="#000" stroke-width="0.8"/><text x="111" y="141.5" dominant-baseline="middle" font-size="10" font-weight="bold">subject</text><text x="369" y="141.5" dominant-baseline="middle" text-anchor="end" font-size="9.5">France</text><rect x="104" y="149" width="272" height="15" fill="#fff" stroke="#000" stroke-width="0.8"/><text x="111" y="156.5" dominant-baseline="middle" font-size="10" font-weight="bold">predicate</text><text x="369" y="156.5" dominant-baseline="middle" text-anchor="end" font-size="9.5">has_capital</text><rect x="104" y="164" width="272" height="15" fill="#fff" stroke="#000" stroke-width="0.8"/><text x="111" y="171.5" dominant-baseline="middle" font-size="10" font-weight="bold">object</text><text x="369" y="171.5" dominant-baseline="middle" text-anchor="end" font-size="9.5">Paris</text><rect x="104" y="179" width="272" height="15" fill="#fff" stroke="#000" stroke-width="0.8"/><text x="111" y="186.5" dominant-baseline="middle" font-size="10" font-weight="bold">polarity</text><text x="369" y="186.5" dominant-baseline="middle" text-anchor="end" font-size="9.5">+</text><rect x="460" y="100" width="250" height="40" rx="4" fill="#ffffff" stroke="#000" stroke-width="1.6"/><text x="585.0" y="120.0" text-anchor="middle" font-size="10.5" font-weight="bold" dominant-baseline="middle">normalize S · P · O · polarity</text><line x1="390" y1="120" x2="460" y2="120" stroke="#000" stroke-width="1.5" marker-end="url(#ah)"/><rect x="460" y="160" width="250" height="40" rx="4" fill="#ffffff" stroke="#000" stroke-width="1.6"/><text x="585.0" y="174.0" text-anchor="middle" font-size="10.5" font-weight="bold" dominant-baseline="middle">SHA-256</text><text x="585.0" y="190.0" text-anchor="middle" font-size="10.5">→ semantic_fingerprint (204)</text><line x1="585" y1="140" x2="585" y2="160" stroke="#000" stroke-width="1.5" marker-end="url(#ah)"/><rect x="460" y="220" width="250" height="40" rx="4" fill="#ffffff" stroke="#000" stroke-width="1.6"/><text x="585.0" y="234.0" text-anchor="middle" font-size="9" font-weight="bold" dominant-baseline="middle">SHA-256(content·source·ingested)</text><text x="585.0" y="250.0" text-anchor="middle" font-size="10.5">→ FUID (206)</text><line x1="240.0" y1="196" x2="240.0" y2="240" stroke="#000" stroke-width="1.5" marker-end="url(#ah)"/><line x1="240.0" y1="240" x2="460" y2="240" stroke="#000" stroke-width="1.5" marker-end="url(#ah)"/><text x="90" y="242" text-anchor="start" font-size="11" font-weight="bold">ENVELOPE METADATA</text><rect x="90" y="250" width="360" height="24" fill="#fff" stroke="#000" stroke-width="0.8"/><text x="97" y="262.0" dominant-baseline="middle" font-size="10.5" font-weight="bold">confidence</text><text x="443" y="262.0" dominant-baseline="middle" text-anchor="end" font-size="10.0">α / β · score · credible interval (208)</text><rect x="90" y="274" width="360" height="24" fill="#fff" stroke="#000" stroke-width="0.8"/><text x="97" y="286.0" dominant-baseline="middle" font-size="10.5" font-weight="bold">provenance</text><text x="443" y="286.0" dominant-baseline="middle" text-anchor="end" font-size="10.0">ref · chain_index · ed25519 sig (210)</text><rect x="90" y="298" width="360" height="24" fill="#fff" stroke="#000" stroke-width="0.8"/><text x="97" y="310.0" dominant-baseline="middle" font-size="10.5" font-weight="bold">certification</text><text x="443" y="310.0" dominant-baseline="middle" text-anchor="end" font-size="10.0">authority_class · trust_score (212)</text><rect x="90" y="322" width="360" height="24" fill="#fff" stroke="#000" stroke-width="0.8"/><text x="97" y="334.0" dominant-baseline="middle" font-size="10.5" font-weight="bold">temporal</text><text x="443" y="334.0" dominant-baseline="middle" text-anchor="end" font-size="10.0">anchor · ingested · attestation (214)</text><rect x="90" y="346" width="360" height="24" fill="#fff" stroke="#000" stroke-width="0.8"/><text x="97" y="358.0" dominant-baseline="middle" font-size="10.5" font-weight="bold">safety</text><text x="443" y="358.0" dominant-baseline="middle" text-anchor="end" font-size="10.0">classification · ACL (216)</text><rect x="90" y="370" width="360" height="24" fill="#fff" stroke="#000" stroke-width="0.8"/><text x="97" y="382.0" dominant-baseline="middle" font-size="10.5" font-weight="bold">links[]</text><text x="443" y="382.0" dominant-baseline="middle" text-anchor="end" font-size="10.0">typed relations to other Fact Units (218)</text><text x="470" y="276" text-anchor="start" font-size="10.5">Immutable once sealed. Identity is derived</text><text x="470" y="294" text-anchor="start" font-size="10.5">from content, not assigned — identical meaning</text><text x="470" y="312" text-anchor="start" font-size="10.5">⇒ identical fingerprint, enabling dedupe,</text><text x="470" y="330" text-anchor="start" font-size="10.5">corroboration, and contradiction detection.</text><text x="470.0" y="636" text-anchor="middle" font-size="15" font-weight="bold">FIG. 2</text></svg>