<svg xmlns="http://www.w3.org/2000/svg" width="940" height="430" viewBox="0 0 940 430" font-family="Arial, Helvetica, sans-serif"><rect width="940" height="430" fill="#ffffff"/><defs><marker id="ah" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 Z" fill="#000"/></marker></defs><text x="470.0" y="26" text-anchor="middle" font-size="15" font-weight="bold">FACT-LEVEL ERASURE BY EXTERNAL-KEY DESTRUCTION</text><rect x="120" y="110" width="240" height="90" rx="4" fill="#ffffff" stroke="#000" stroke-width="1.6"/><text x="240.0" y="149.0" text-anchor="middle" font-size="11" font-weight="bold" dominant-baseline="middle">SEALED FACT</text><text x="240.0" y="165.0" text-anchor="middle" font-size="10.5">encrypted payload (900)</text><rect x="580" y="110" width="240" height="90" rx="4" fill="#ffffff" stroke="#000" stroke-width="1.6"/><text x="700.0" y="149.0" text-anchor="middle" font-size="11" font-weight="bold" dominant-baseline="middle">EXTERNAL KEY</text><text x="700.0" y="165.0" text-anchor="middle" font-size="10.5">held off-system (902)</text><line x1="360" y1="155" x2="580" y2="155" stroke="#000" stroke-width="1.5" marker-end="url(#ah)"/><text x="470.0" y="145" text-anchor="middle" font-size="10">decrypts</text><line x1="700" y1="230" x2="820" y2="300" stroke="#000" stroke-width="3"/><line x1="820" y1="230" x2="700" y2="300" stroke="#000" stroke-width="3"/><text x="760" y="320" text-anchor="middle" font-size="10.5">key destroyed (904)</text><rect x="120" y="250" width="240" height="70" rx="4" fill="#ffffff" stroke="#000" stroke-width="1.6"/><text x="240.0" y="279.0" text-anchor="middle" font-size="11" font-weight="bold" dominant-baseline="middle">UNRECOVERABLE</text><text x="240.0" y="295.0" text-anchor="middle" font-size="10.5">payload now inert (906)</text><line x1="640" y1="300" x2="360" y2="300" stroke="#000" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ah)"/><text x="470.0" y="380" text-anchor="middle" font-size="10.5">Erase one fact by destroying its key; the content-addressed store is otherwise append-only and immutable.</text><text x="470.0" y="416" text-anchor="middle" font-size="15" font-weight="bold">FIG. 9</text></svg>