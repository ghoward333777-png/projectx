<svg xmlns="http://www.w3.org/2000/svg" width="940" height="320" viewBox="0 0 940 320" font-family="Arial, Helvetica, sans-serif"><rect width="940" height="320" fill="#ffffff"/><defs><marker id="ah" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 Z" fill="#000"/></marker></defs><text x="470.0" y="26" text-anchor="middle" font-size="15" font-weight="bold">FQL — JOINT STRUCTURE + TRUST EXECUTION</text><rect x="70" y="90" width="150" height="64" rx="4" fill="#ffffff" stroke="#000" stroke-width="1.6"/><text x="145.0" y="116.0" text-anchor="middle" font-size="11" font-weight="bold" dominant-baseline="middle">QUERY</text><text x="145.0" y="132.0" text-anchor="middle" font-size="10.5">structure pattern</text><text x="145.0" y="145.0" text-anchor="middle" font-size="10.5">+ trust ≥ τ (600)</text><rect x="250" y="90" width="125" height="64" rx="4" fill="#ffffff" stroke="#000" stroke-width="1.6"/><text x="312.5" y="116.0" text-anchor="middle" font-size="9.5" font-weight="bold" dominant-baseline="middle">STRUCTURE FILTER</text><text x="312.5" y="132.0" text-anchor="middle" font-size="10.5">match S/P/O</text><text x="254" y="170" font-size="12" font-style="italic" font-weight="bold">602</text><line x1="220" y1="122.0" x2="250" y2="122.0" stroke="#000" stroke-width="1.5" marker-end="url(#ah)"/><rect x="383" y="90" width="125" height="64" rx="4" fill="#ffffff" stroke="#000" stroke-width="1.6"/><text x="445.5" y="116.0" text-anchor="middle" font-size="9.5" font-weight="bold" dominant-baseline="middle">TRUST PROPAGATION</text><text x="445.5" y="132.0" text-anchor="middle" font-size="10.5">combine source trust</text><text x="387" y="170" font-size="12" font-style="italic" font-weight="bold">604</text><line x1="375" y1="122.0" x2="383" y2="122.0" stroke="#000" stroke-width="1.5" marker-end="url(#ah)"/><rect x="516" y="90" width="125" height="64" rx="4" fill="#ffffff" stroke="#000" stroke-width="1.6"/><text x="578.5" y="116.0" text-anchor="middle" font-size="9.5" font-weight="bold" dominant-baseline="middle">BRANCH & BOUND</text><text x="578.5" y="132.0" text-anchor="middle" font-size="10.5">prune below τ</text><text x="520" y="170" font-size="12" font-style="italic" font-weight="bold">606</text><line x1="508" y1="122.0" x2="516" y2="122.0" stroke="#000" stroke-width="1.5" marker-end="url(#ah)"/><rect x="649" y="90" width="125" height="64" rx="4" fill="#ffffff" stroke="#000" stroke-width="1.6"/><text x="711.5" y="116.0" text-anchor="middle" font-size="9.5" font-weight="bold" dominant-baseline="middle">CONTRADICTION</text><text x="711.5" y="132.0" text-anchor="middle" font-size="10.5">exclude conflicting</text><text x="653" y="170" font-size="12" font-style="italic" font-weight="bold">608</text><line x1="641" y1="122.0" x2="649" y2="122.0" stroke="#000" stroke-width="1.5" marker-end="url(#ah)"/><rect x="782" y="90" width="125" height="64" rx="4" fill="#ffffff" stroke="#000" stroke-width="1.6"/><text x="844.5" y="116.0" text-anchor="middle" font-size="9.5" font-weight="bold" dominant-baseline="middle">RANKED RESULTS</text><text x="844.5" y="132.0" text-anchor="middle" font-size="10.5">+ resp. provenance hash</text><text x="786" y="170" font-size="12" font-style="italic" font-weight="bold">610</text><line x1="774" y1="122.0" x2="782" y2="122.0" stroke="#000" stroke-width="1.5" marker-end="url(#ah)"/><text x="470.0" y="224" text-anchor="middle" font-size="10.5">Structure and certification are evaluated together, so pruning happens during traversal — not as a post-filter.</text><text x="470.0" y="306" text-anchor="middle" font-size="15" font-weight="bold">FIG. 6</text></svg>