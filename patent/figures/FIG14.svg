<svg xmlns="http://www.w3.org/2000/svg" width="940" height="460" viewBox="0 0 940 460" font-family="Arial, Helvetica, sans-serif"><rect width="940" height="460" fill="#ffffff"/><defs><marker id="ah" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 Z" fill="#000"/></marker></defs><text x="470.0" y="26" text-anchor="middle" font-size="15" font-weight="bold">USER-OWNED AGENT SYSTEM WITH GOVERNANCE & KILL SWITCH</text><rect x="70" y="90" width="190" height="64" rx="4" fill="#ffffff" stroke="#000" stroke-width="1.6"/><text x="165.0" y="116.0" text-anchor="middle" font-size="10.5" font-weight="bold" dominant-baseline="middle">BLUEPRINT</text><text x="165.0" y="132.0" text-anchor="middle" font-size="10.5">definition + register (1400)</text><rect x="330" y="90" width="190" height="64" rx="4" fill="#ffffff" stroke="#000" stroke-width="1.6"/><text x="425.0" y="116.0" text-anchor="middle" font-size="10" font-weight="bold" dominant-baseline="middle">AGENT INSTANCE</text><text x="425.0" y="132.0" text-anchor="middle" font-size="10.5">commissioner-bounded</text><text x="425.0" y="145.0" text-anchor="middle" font-size="10.5">authority (1402)</text><line x1="260" y1="122" x2="330" y2="122" stroke="#000" stroke-width="1.5" marker-end="url(#ah)"/><rect x="590" y="90" width="190" height="64" rx="4" fill="#ffffff" stroke="#000" stroke-width="1.6"/><text x="685.0" y="116.0" text-anchor="middle" font-size="10" font-weight="bold" dominant-baseline="middle">ACTION</text><text x="685.0" y="132.0" text-anchor="middle" font-size="10.5">template ∩ entitlement (1404)</text><line x1="520" y1="122" x2="590" y2="122" stroke="#000" stroke-width="1.5" marker-end="url(#ah)"/><polygon points="470.0,213.0 595.0,250 470.0,287.0 345.0,250" fill="#fff" stroke="#000" stroke-width="1.6"/><text x="470.0" y="250" text-anchor="middle" dominant-baseline="middle" font-size="11" font-weight="bold">GOVERNANCE EVAL</text><text x="601.0" y="225" font-size="12" font-style="italic" font-weight="bold">1406</text><line x1="685" y1="154" x2="515.0" y2="218" stroke="#000" stroke-width="1.5" marker-end="url(#ah)"/><line x1="345.0" y1="250" x2="200" y2="250" stroke="#000" stroke-width="1.5" marker-end="url(#ah)"/><rect x="70" y="228" width="130" height="44" rx="4" fill="#ffffff" stroke="#000" stroke-width="1.6"/><text x="135.0" y="244.0" text-anchor="middle" font-size="10.5" font-weight="bold" dominant-baseline="middle">ALLOW</text><text x="135.0" y="260.0" text-anchor="middle" font-size="10.5">execute (1408)</text><line x1="595.0" y1="250" x2="740" y2="250" stroke="#000" stroke-width="1.5" marker-end="url(#ah)"/><rect x="740" y="228" width="130" height="44" rx="4" fill="#ffffff" stroke="#000" stroke-width="1.6"/><text x="805.0" y="244.0" text-anchor="middle" font-size="10.5" font-weight="bold" dominant-baseline="middle">DENY / LOG</text><text x="805.0" y="260.0" text-anchor="middle" font-size="10.5">(1410)</text><rect x="370.0" y="330" width="200" height="58" rx="6" fill="#fff" stroke="#000" stroke-width="2.4"/><text x="470.0" y="352" text-anchor="middle" font-size="12" font-weight="bold">⏻ KILL / REVOKE SWITCH</text><text x="470.0" y="372" text-anchor="middle" font-size="9">commissioner halts the instance at any time (1412)</text><line x1="470.0" y1="287" x2="470.0" y2="330" stroke="#000" stroke-width="1.5" marker-end="url(#ah)"/><text x="470.0" y="416" text-anchor="middle" font-size="10.5">Governance is checked at every action; an agent can never exceed its commissioner, who holds an unconditional kill control.</text><text x="470.0" y="446" text-anchor="middle" font-size="15" font-weight="bold">FIG. 14</text></svg>