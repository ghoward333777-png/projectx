<svg xmlns="http://www.w3.org/2000/svg" width="940" height="440" viewBox="0 0 940 440" font-family="Arial, Helvetica, sans-serif"><rect width="940" height="440" fill="#ffffff"/><defs><marker id="ah" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 Z" fill="#000"/></marker></defs><text x="470.0" y="26" text-anchor="middle" font-size="15" font-weight="bold">FEDERATION — CROSS-BOUNDARY RE-VALIDATION</text><rect x="60" y="70" width="360" height="300" rx="6" fill="#eef2f8" stroke="#000" stroke-width="1.6"/><text x="70" y="86" font-size="11" font-weight="bold" letter-spacing="1">DOMAIN A (800)</text><rect x="520" y="70" width="360" height="300" rx="6" fill="#eef2f8" stroke="#000" stroke-width="1.6"/><text x="530" y="86" font-size="11" font-weight="bold" letter-spacing="1">DOMAIN B (802)</text><rect x="110" y="150" width="250" height="80" rx="4" fill="#ffffff" stroke="#000" stroke-width="1.6"/><text x="235.0" y="184.0" text-anchor="middle" font-size="10.5" font-weight="bold" dominant-baseline="middle">CERTIFIED ENVELOPE</text><text x="235.0" y="200.0" text-anchor="middle" font-size="10.5">fingerprint · signature</text><text x="235.0" y="213.0" text-anchor="middle" font-size="10.5">· authority (804)</text><rect x="570" y="150" width="250" height="80" rx="4" fill="#ffffff" stroke="#000" stroke-width="1.6"/><text x="695.0" y="184.0" text-anchor="middle" font-size="10.5" font-weight="bold" dominant-baseline="middle">RE-VALIDATION</text><text x="695.0" y="200.0" text-anchor="middle" font-size="10.5">re-check sig + trust</text><text x="695.0" y="213.0" text-anchor="middle" font-size="10.5">before admission (806)</text><line x1="360" y1="190" x2="570" y2="190" stroke="#000" stroke-width="1.5" marker-end="url(#ah)"/><line x1="470.0" y1="60" x2="470.0" y2="380" stroke="#000" stroke-width="1.4" stroke-dasharray="6 5"/><text x="470.0" y="400" text-anchor="middle" font-size="10.5">A fact certified in one domain is re-validated by the receiver 