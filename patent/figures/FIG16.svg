<svg xmlns="http://www.w3.org/2000/svg" width="940" height="650" viewBox="0 0 940 650" font-family="Arial, Helvetica, sans-serif"><rect width="940" height="650" fill="#ffffff"/><defs><marker id="ah" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 Z" fill="#000"/></marker></defs><text x="470.0" y="26" text-anchor="middle" font-size="15" font-weight="bold">SEMANTIC COMPRESSION, EXPANSION, COLORIZATION & UPSCALING</text><rect x="70" y="150" width="170" height="90" rx="4" fill="#ffffff" stroke="#000" stroke-width="1.6"/><text x="155.0" y="189.0" text-anchor="middle" font-size="11" font-weight="bold" dominant-baseline="middle">MEDIA</text><text x="155.0" y="205.0" text-anchor="middle" font-size="10.5">pixels / waveform (1600)</text><rect x="300" y="150" width="210" height="90" rx="4" fill="#ffffff" stroke="#000" stroke-width="1.6"/><text x="405.0" y="189.0" text-anchor="middle" font-size="10.5" font-weight="bold" dominant-baseline="middle">SEMANTIC COMPRESSION</text><text x="405.0" y="205.0" text-anchor="middle" font-size="10.5">extract meaning (1602)</text><line x1="240" y1="195" x2="300" y2="195" stroke="#000" stroke-width="1.5" marker-end="url(#ah)"/><rect x="570" y="150" width="180" height="90" rx="4" fill="#ffffff" stroke="#000" stroke-width="1.6"/><text x="660.0" y="189.0" text-anchor="middle" font-size="10.5" font-weight="bold" dominant-baseline="middle">MEANING STORE</text><text x="660.0" y="205.0" text-anchor="middle" font-size="10.5">compact Fact Units (1604)</text><line x1="510" y1="195" x2="570" y2="195" stroke="#000" stroke-width="1.5" marker-end="url(#ah)"/><rect x="570" y="300" width="200" height="54" rx="4" fill="#ffffff" stroke="#000" stroke-width="1.6"/><text x="670.0" y="321.0" text-anchor="middle" font-size="10" font-weight="bold" dominant-baseline="middle">EXPANSION</text><text x="670.0" y="337.0" text-anchor="middle" font-size="10.5">any resolution</text><text x="544" y="327" font-size="12" font-style="italic" font-weight="bold">1606</text><line x1="660" y1="240" x2="660" y2="300" stroke="#000" stroke-width="1.5" marker-end="url(#ah)"/><rect x="570" y="372" width="200" height="54" rx="4" fill="#ffffff" stroke="#000" stroke-width="1.6"/><text x="670.0" y="393.0" text-anchor="middle" font-size="10" font-weight="bold" dominant-baseline="middle">COLORIZATION</text><text x="670.0" y="409.0" text-anchor="middle" font-size="10.5">material-property facts</text><text x="544" y="399" font-size="12" font-style="italic" font-weight="bold">1608</text><line x1="660" y1="240" x2="660" y2="372" stroke="#000" stroke-width="1.5" marker-end="url(#ah)"/><rect x="570" y="444" width="200" height="54" rx="4" fill="#ffffff" stroke="#000" stroke-width="1.6"/><text x="670.0" y="465.0" text-anchor="middle" font-size="10" font-weight="bold" dominant-baseline="middle">UPSCALING</text><text x="670.0" y="481.0" text-anchor="middle" font-size="10.5">surface regenerated</text><text x="544" y="471" font-size="12" font-style="italic" font-weight="bold">1610</text><line x1="660" y1="240" x2="660" y2="444" stroke="#000" stroke-width="1.5" marker-end="url(#ah)"/><text x="470.0" y="586" text-anchor="middle" font-size="10.5">Store meaning, not surface; compression and regeneration are the same primitive — no generational quality loss.</text><text x="470.0" y="636" text-anchor="middle" font-size="15" font-weight="bold">FIG. 16</text></svg>