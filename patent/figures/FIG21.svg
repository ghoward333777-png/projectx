<svg xmlns="http://www.w3.org/2000/svg" width="940" height="380" viewBox="0 0 940 380" font-family="Arial, Helvetica, sans-serif"><rect width="940" height="380" fill="#ffffff"/><defs><marker id="ah" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 Z" fill="#000"/></marker></defs><text x="470.0" y="26" text-anchor="middle" font-size="15" font-weight="bold">UFCS PACKET FRAMING — CONTENT-ADDRESSED BLOCK STORAGE</text><rect x="70" y="110" width="56" height="70" rx="4" fill="#fff" stroke="#000" stroke-width="1.4"/><text x="98" y="145" text-anchor="middle" font-size="10">pkt</text><rect x="140" y="110" width="56" height="70" rx="4" fill="#fff" stroke="#000" stroke-width="1.4"/><text x="168" y="145" text-anchor="middle" font-size="10">pkt</text><rect x="210" y="110" width="56" height="70" rx="4" fill="#fff" stroke="#000" stroke-width="1.4"/><text x="238" y="145" text-anchor="middle" font-size="10">pkt</text><rect x="280" y="110" width="56" height="70" rx="4" fill="#fff" stroke="#000" stroke-width="1.4"/><text x="308" y="145" text-anchor="middle" font-size="10">pkt</text><text x="200" y="100" text-anchor="middle" font-size="10.5">PACKET STREAM (2100)</text><line x1="360" y1="145" x2="430" y2="145" stroke="#000" stroke-width="1.5" marker-end="url(#ah)"/><rect x="430" y="110" width="170" height="70" rx="4" fill="#ffffff" stroke="#000" stroke-width="1.6"/><text x="515.0" y="139.0" text-anchor="middle" font-size="10" font-weight="bold" dominant-baseline="middle">BLOCK WRITER</text><text x="515.0" y="155.0" text-anchor="middle" font-size="10.5">dedupe by fingerprint (2102)</text><line x1="600" y1="145" x2="670" y2="145" stroke="#000" stroke-width="1.5" marker-end="url(#ah)"/><rect x="670" y="90" width="200" height="54" rx="4" fill="#ffffff" stroke="#000" stroke-width="1.6"/><text x="770.0" y="111.0" text-anchor="middle" font-size="9.5" font-weight="bold" dominant-baseline="middle">BLOCK block_00001</text><text x="770.0" y="127.0" text-anchor="middle" font-size="10.5">~1 GB gzip/bz2 (2104)</text><rect x="670" y="160" width="200" height="54" rx="4" fill="#ffffff" stroke="#000" stroke-width="1.6"/><text x="770.0" y="181.0" text-anchor="middle" font-size="9.5" font-weight="bold" dominant-baseline="middle">FINGERPRINT INDEX</text><text x="770.0" y="197.0" text-anchor="middle" font-size="10.5">content-addressed lookup (2106)</text><line x1="600" y1="130" x2="670" y2="117" stroke="#000" stroke-width="1.5" marker-end="url(#ah)"/><line x1="600" y1="160" x2="670" y2="187" stroke="#000" stroke-width="1.5" marker-end="url(#ah)"/><text x="470.0" y="280" text-anchor="middle" font-size="10.5">Immutable packets are appended to ~1 GB content-addressed blocks; a fingerprint index gives O(1) dedupe and retrieval.</text><text x="470.0" y="310" text-anchor="middle" font-size="10.5">Identical meaning ⇒ identical fingerprint ⇒ stored once; corroboration and contradiction are detected at ingest.</text><text x="470.0" y="366" text-anchor="middle" font-size="15" font-weight="bold">FIG. 21</text></svg>