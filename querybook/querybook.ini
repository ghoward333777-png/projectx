; QueryBook settings. Edit with Notepad (Windows) or TextEdit (Mac), then restart QueryBook.
[querybook]

; Where QueryBook keeps its database, inbox and rendered videos.
; Blank = D:\QueryBook on Windows when there is a D: drive.
data_folder = D:\QueryBook

; Existing folders QueryBook should read from continuously (read-only: it never
; changes, moves or deletes your files). One per line, indented, or separate with ;
; Subfolders named language, stem, history or video choose the app; other files
; are sorted automatically. Do NOT list a very large store here (such as
; D:\qb): folders are re-scanned and copied in; large stores need a direct connector.
; Files are sorted automatically. Supported files: .txt .md .json .jsonl .csv
; QueryBook's own inbox and renders subfolders are always skipped here.
; Example:
;   watch_folders =
;       D:\Data
;       D:\Research\History
watch_folders =

; How often to re-check the watch folders, in seconds (large folders: use 30 or more).
watch_interval_seconds = 10
