# QueryBook harvest pack: basic math, science, engineering, geography and
# history facts from Wikidata (CC0). One query per property so rows do not
# multiply. Each query returns ?s (subject item) and ?o (object item or
# literal), with ?sLabel / ?oLabel from the label service. The harvester adds
# ORDER BY / LIMIT / OFFSET itself; do not put them in the queries.
#
#   qb harvest-wikidata --pack config/harvest/wikidata-basics.toml --out data/harvest/wikidata
#   qb import-ufcs --mapping config/harvest/wikidata-mapping.toml --file data/harvest/wikidata
#
# Size knobs: the wikibase:sitelinks thresholds (how many Wikipedias cover an
# item) keep each query to well-known items. Lower them to harvest more.

endpoint = "https://query.wikidata.org/sparql"
# Wikimedia asks every client to identify itself with a way to reach the
# operator. Put your project URL or contact address here.
contact = "QueryBook harvester (set contact in the harvest pack)"
page_size = 5000
pause_ms = 1500
confidence = 0.9      # prior confidence for a Wikidata statement
weight = 3.0          # evidential weight of one statement

# ------------------------------------------------------------ geography ----

[[query]]
id = "geo.country.capital"
domain = "geography"
predicate = "capital"
object_kind = "entity"
text = "{o} is the capital of {s}."
sparql = """SELECT ?s ?sLabel ?o ?oLabel WHERE {
  ?s wdt:P31 wd:Q3624078 . FILTER NOT EXISTS { ?s wdt:P576 ?end }
  ?s wdt:P36 ?o .
  SERVICE wikibase:label { bd:serviceParam wikibase:language "en". } }"""

