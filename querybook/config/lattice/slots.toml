# QueryBook knowledge lattice — slot library.
#
# A slot is one attribute a class member is expected to carry, bound to one
# Wikidata property. Every class in the lattice names the slots it expects;
# every (member x slot) pair is a cell. Cells are predicted first, harvested
# later, and each prediction is confirmed or refuted by what is harvested.
#
#   id         lattice name (unique)
#   predicate  governed predicate the harvested facts carry (default: id)
#   pid        Wikidata property
#   kind       entity | number | year | text
#   text       rendering; {s} member label, {o} value
#   one        true when a member has at most one value (a functional slot)
#   normalize  number: read the SI-normalized amount (psn:) instead of the stated one
#   scale / offset / decimals / unit / sci   number formatting (value * scale + offset)
#
# Drafted with AI assistance and validated live against Wikidata
# (`qb lattice validate --live`); a wrong id is a validation failure, not a guess.

