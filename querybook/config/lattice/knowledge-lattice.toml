# ============================================================== rules
#
# Invariant-level expectations (QBF-C102): regularities of the world that
# predict a cell's value from cells already known. Each rule has a prior
# confidence; confirmations and refutations update its reliability
# (a Beta posterior), and a refuted prediction is attributed to the lowest
# level that explains it (QBF-C103) — never silently to the rule.
#
#   inverse    X.from_slot = Y            =>  Y.slot = X        (Y a member of `class`)
#   symmetric  X.slot = Y                 =>  Y.slot = X
#   chain      X.path[0] = Y, Y.path[1] = Z  =>  X.slot = Z
#   constant   every member of `class`    =>  slot = value
#   mode       a slot whose observed values in `class` concentrate on one value
#              (share >= min_share over >= min_support members) predicts it
#              for the members not yet observed (conceptual level)

[[rule]]
id = "capital-lies-in-its-country"
kind = "inverse"
class = "geo.capital"
slot = "country"
from_slot = "capital"
confidence = 0.95

[[rule]]
id = "capital-of-inverse"
kind = "inverse"
class = "geo.capital"
slot = "capital_of"
from_slot = "capital"
confidence = 0.9

[[rule]]
id = "borders-are-mutual"
kind = "symmetric"
class = "geo.country"
slot = "shares_border_with"
confidence = 0.97

[[rule]]
id = "city-continent-from-country"
kind = "chain"
class = "geo.city"
slot = "continent"
path = ["country", "continent"]
confidence = 0.9

[[rule]]
id = "mountain-continent-from-country"
kind = "chain"
class = "geo.mountain"
slot = "continent"
path = ["country", "continent"]
confidence = 0.85

[[rule]]
id = "lake-continent-from-country"
kind = "chain"
class = "geo.lake"
slot = "continent"
path = ["country", "continent"]
confidence = 0.85

[[rule]]
id = "planets-orbit-the-sun"
kind = "constant"
class = "astro.planet"
slot = "parent_body"
value = "Q525"
value_label = "Sun"
confidence = 0.99

[[rule]]
id = "dwarf-planets-orbit-the-sun"
kind = "constant"
class = "astro.dwarf"
slot = "parent_body"
value = "Q525"
value_label = "Sun"
confidence = 0.95

[[rule]]
id = "tributary-inverse"
kind = "inverse"
class = "geo.river"
slot = "tributary"
from_slot = "flows_into"
confidence = 0.85

[[rule]]
id = "citizenship-from-birthplace-country"
kind = "chain"
class = "people.*"
slot = "citizen_of"
path = ["birthplace", "country"]
confidence = 0.7

[[rule]]
id = "university-country-from-location"
kind = "chain"
class = "edu.university"
slot = "country"
path = ["located_in", "country"]
confidence = 0.95

[[rule]]
id = "stadium-country-from-location"
kind = "chain"
class = "sport.stadium"
slot = "country"
path = ["located_in", "country"]
confidence = 0.95

[[rule]]
