# QueryBook knowledge lattice — the upper structure of general knowledge.
#
# Structure first, facts later: domains -> subdomains -> classes, each class
# a set of real-world members (a Wikidata class plus a notability floor) and
# the slots every member is expected to carry. The lattice turns "harvest the
# world" into a finite grid of cells, predicts what most cells hold, and then
# spends queries only on confirming or filling those cells.
#
#   qb lattice validate --live     structure checks + every QID/PID checked against Wikidata
#   qb lattice census              members and slot fill rates per class (conceptual expectations)
#   qb lattice expect              value predictions from the invariant rules below
#   qb lattice fill                targeted harvest of the predicted/open cells (UFCS envelopes)
#   qb lattice confirm             confirm / refute every expectation against admitted facts
#   qb lattice report              coverage, rule precision, calibration findings, gaps
#
# The structure was drafted with AI assistance (and can be extended with
# `qb lattice propose --engine claude`); nothing here is a fact. Expectations
# are D5 predictions and never enter the fact store (induction may not write);
# only harvested, re-validated records do.
#
# Class fields: id, sub, label, qid (members are `?s wdt:P31 wd:<qid>`),
# pattern (replaces that membership triple), where (extra SPARQL), deep
# (follow subclass-of), min_sitelinks (notability floor), slots, texts
# (per-class rendering overrides by slot id).

version = 1
title = "QueryBook upper knowledge lattice"
slots_file = "slots.toml"

