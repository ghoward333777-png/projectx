# renderer_nerf — GPU defaults (A100/H100 class). For a CPU smoke run use the script's --tiny flag.
name: renderer_nerf
device: cuda
checkpoint_dir: checkpoints
log_every: 50
eval_every: 2000
model:
  dim: 256
  layers: 4
  heads: 4
data:
  train_manifest: data/manifests/renderer_nerf_train.jsonl
  val_manifest: data/manifests/renderer_nerf_val.jsonl
  batch_size: 8

optim:
  lr: 0.0003
  warmup_steps: 2000
  max_steps: 200000
