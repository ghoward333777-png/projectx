# identity_encoder — GPU defaults (A100/H100 class). For a CPU smoke run use the script's --tiny flag.
name: identity_encoder
device: cuda
checkpoint_dir: checkpoints
log_every: 50
eval_every: 2000
model:
  dim: 256
  layers: 4
  heads: 4
data:
  train_manifest: data/manifests/identity_encoder_train.jsonl
  val_manifest: data/manifests/identity_encoder_val.jsonl
  batch_size: 32
  num_workers: 8
optim:
  lr: 0.0003
  warmup_steps: 2000
  max_steps: 200000
