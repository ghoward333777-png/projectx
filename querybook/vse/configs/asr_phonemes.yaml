# asr_phonemes — GPU defaults (A100/H100 class). For a CPU smoke run use the script's --tiny flag.
name: asr_phonemes
device: cuda
checkpoint_dir: checkpoints
log_every: 50
eval_every: 2000
model:
  dim: 512
  layers: 12
  heads: 8
data:
  train_manifest: data/manifests/asr_phonemes_train.jsonl
  val_manifest: data/manifests/asr_phonemes_val.jsonl
  batch_size: 32
  n_mels: 80
optim:
  lr: 0.0003
  warmup_steps: 2000
  max_steps: 200000
