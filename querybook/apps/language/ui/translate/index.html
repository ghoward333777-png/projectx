<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>QueryBook Translate</title>
  <meta name="description" content="Offline-first universal translator that never makes up words: coverage and provenance on every translation.">
  <meta name="theme-color" content="#0b6e5f" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0d1513" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Translate">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <header class="topbar">
    <div class="brand">
      <svg class="logo" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="currentColor"/><path d="M8 10h11a3 3 0 0 1 3 3v4a3 3 0 0 1-3 3h-6l-4 3v-3a3 3 0 0 1-1-2v-5a3 3 0 0 1 0-3z" fill="var(--on-accent)"/><path d="M24 14v6a3 3 0 0 1-3 3h-4l3 2.5V23h2" fill="none" stroke="var(--on-accent)" stroke-width="1.6" stroke-linecap="round"/></svg>
      <span class="brand-name">QueryBook <b>Translate</b></span>
    </div>
    <button id="net-badge" class="badge" type="button" aria-live="polite" title="Network and cloud status">On-device</button>
    <button id="open-settings" class="icon-btn" type="button" aria-label="Settings">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15.5A3.5 3.5 0 1 0 12 8.5a3.5 3.5 0 0 0 0 7Z" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>
    </button>
  </header>

  <div class="langbar" id="langbar">
    <div class="lang-slot">
      <button class="chip lang-chip" id="src-chip" type="button" aria-haspopup="dialog"></button>
      <select class="dialect" id="src-dialect" aria-label="Source dialect"></select>
    </div>
    <button class="icon-btn swap" id="swap" type="button" aria-label="Swap languages">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7h12l-3-3M17 17H5l3 3" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <div class="lang-slot">
      <button class="chip lang-chip" id="tgt-chip" type="button" aria-haspopup="dialog"></button>
      <select class="dialect" id="tgt-dialect" aria-label="Target dialect"></select>
    </div>
    <label class="domain">
      <span class="visually-hidden">Domain</span>
      <select id="domain" aria-label="Vocabulary domain"></select>
    </label>
  </div>

  <main id="main">
    <!-- Translate (text + one-way speech) -->
    <section class="view" id="view-translate" data-view="translate">
      <div class="lid-banner" id="lid-banner" hidden></div>
      <div class="card input-card">
        <textarea id="input" dir="auto" rows="3" placeholder="Type, paste, or tap the mic" autocomplete="off" autocapitalize="sentences" spellcheck="false" aria-label="Text to translate"></textarea>
        <div class="input-tools">
          <span class="asr-state" id="asr-state" aria-live="polite"></span>
          <button class="icon-btn" id="clear" type="button" aria-label="Clear">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          </button>
        </div>
      </div>
      <div class="mic-row">
        <button class="mic" id="mic" type="button" aria-label="Speak">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="12" rx="3" fill="currentColor"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        </button>
      </div>
      <div id="result"></div>
    </section>

    <!-- Conversation -->
    <section class="view" id="view-converse" data-view="converse" hidden>
      <div class="converse">
        <div class="party party-b" id="party-b">
          <div class="party-head"><span class="party-lang" id="party-b-lang"></span><button class="mic small" id="mic-b" type="button" aria-label="Other person speaks"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="12" rx="3" fill="currentColor"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button></div>
          <ol class="turns" id="turns-b" aria-live="polite"></ol>
        </div>
        <div class="converse-tools">
          <label class="toggle"><input type="checkbox" id="face-to-face"> Face-to-face</label>
          <label class="toggle"><input type="checkbox" id="auto-speak" checked> Speak translations</label>
          <button class="text-btn" id="converse-clear" type="button">Clear</button>
        </div>
        <div class="party party-a" id="party-a">
          <ol class="turns" id="turns-a" aria-live="polite"></ol>
          <div class="party-head"><span class="party-lang" id="party-a-lang"></span><button class="mic small" id="mic-a" type="button" aria-label="You speak"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="12" rx="3" fill="currentColor"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button></div>
          <form class="type-turn" id="type-turn"><input id="type-turn-input" dir="auto" placeholder="Or type your turn" autocomplete="off"><button class="text-btn" type="submit">Send</button></form>
        </div>
      </div>
    </section>

    <!-- Phrasebook -->
    <section class="view" id="view-phrasebook" data-view="phrasebook" hidden>
      <div class="section-head">
        <h2>Phrasebook</h2>
        <input id="pb-search" type="search" placeholder="Search saved phrases" aria-label="Search phrasebook">
      </div>
      <div class="filters" id="pb-filters" role="tablist"></div>
      <ul class="phrase-list" id="pb-saved"></ul>
      <h3 class="sub">Essentials for this language pair <small>generated offline from the installed dictionaries</small></h3>
      <ul class="phrase-list" id="pb-essentials"></ul>
    </section>

    <!-- Languages & packs -->
    <section class="view" id="view-packs" data-view="packs" hidden>
      <div class="section-head">
        <h2>Languages</h2>
        <div class="storage" id="storage-summary"></div>
      </div>
      <div class="pack-tools">
        <input id="lang-search" type="search" placeholder="Search 100+ languages by name, native name or code" aria-label="Search languages">
        <div class="filters" id="lang-filters"></div>
        <label class="text-btn file-btn">Import pack…<input type="file" id="import-pack" accept="application/json,.json" hidden></label>
      </div>
      <ul class="lang-list" id="lang-list"></ul>
    </section>

    <!-- System Monitor -->
    <section class="view" id="view-monitor" data-view="monitor" hidden>
      <div class="section-head"><h2>System Monitor</h2><button class="text-btn" id="run-qc" type="button">Run QC battery</button></div>
      <div class="monitor" id="monitor"></div>
    </section>
  </main>

  <nav class="tabs" aria-label="Modes">
    <button type="button" data-tab="translate" aria-current="page"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h9M8.5 3v2M6 5c.8 3.4 3.2 6 6 7.5M11 5c-.8 3.6-3.4 6.6-6.5 8M13 21l4-10 4 10M14.5 17.5h5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Translate</span></button>
    <button type="button" data-tab="converse"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h10a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2H9l-4 3v-3a2 2 0 0 1-1-2V7a2 2 0 0 1 0-2zM18 9h1a2 2 0 0 1 2 2v5a2 2 0 0 1-1 2v3l-4-3h-3" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg><span>Converse</span></button>
    <button type="button" data-tab="phrasebook"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h11a1 1 0 0 1 1 1v17l-6-4-6 4V4a1 1 0 0 1 0-1z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg><span>Phrasebook</span></button>
    <button type="button" data-tab="packs"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M3 12h18M12 3c2.5 2.6 3.8 5.6 3.8 9s-1.3 6.4-3.8 9c-2.5-2.6-3.8-5.6-3.8-9S9.5 5.6 12 3z" fill="none" stroke="currentColor" stroke-width="1.7"/></svg><span>Languages</span></button>
    <button type="button" data-tab="monitor"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12h4l3-7 4 14 3-7h4" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Monitor</span></button>
  </nav>

  <!-- Language picker -->
  <dialog class="sheet" id="picker" aria-labelledby="picker-title">
    <form method="dialog" class="sheet-head">
      <h2 id="picker-title">Choose language</h2>
      <button class="icon-btn" value="cancel" aria-label="Close"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button>
    </form>
    <input id="picker-search" type="search" placeholder="Search by name, native name or code" aria-label="Search languages">
    <ul class="picker-list" id="picker-list"></ul>
  </dialog>

  <!-- Provenance panel -->
  <dialog class="sheet" id="provenance" aria-labelledby="prov-title">
    <form method="dialog" class="sheet-head">
      <h2 id="prov-title">Where this came from</h2>
      <button class="icon-btn" value="cancel" aria-label="Close"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button>
    </form>
    <div id="prov-body"></div>
  </dialog>

  <!-- Settings -->
  <dialog class="sheet" id="settings" aria-labelledby="settings-title">
    <form method="dialog" class="sheet-head">
      <h2 id="settings-title">Settings</h2>
      <button class="icon-btn" value="cancel" aria-label="Close"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button>
    </form>
    <div class="settings-body" id="settings-body"></div>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <noscript><p class="noscript">QueryBook Translate needs JavaScript. Everything runs on your device; nothing is sent anywhere.</p></noscript>
  <script type="module" src="src/app.js"></script>
</body>
</html>
