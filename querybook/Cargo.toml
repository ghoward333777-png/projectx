[package]
name = "querybook"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
argon2 = "0.6.0"
axum = { version = "0.8.9", features = ["multipart"] }
base64 = "0.23.1"
chacha20poly1305 = "0.10"
clap = { version = "4.6.7", features = ["derive", "env"] }
crc32fast = "1.5.2"
ed25519-dalek = "3.0.0"
getrandom = "0.4.3"
hex = "0.4.3"
hmac = "0.13.0"
rayon = "1.12.0"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "blocking", "system-proxy", "query", "form"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["float_roundtrip"] }
sha2 = "0.11.0"
tantivy = "0.26.2"
tokio = { version = "1.53.1", features = ["full"] }
toml = "1.1.6"
unicode-normalization = "0.1.25"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
zstd = "0.13"

[[bin]]
name = "qb"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
