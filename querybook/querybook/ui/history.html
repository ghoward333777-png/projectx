<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QueryBook · History</title>
<link rel="stylesheet" href="/static/common.css">
<style>

.eras { display: flex; gap: 4px; margin: 0 0 16px; flex-wrap: wrap; }
.era { flex: 1 1 120px; background: var(--accent-soft); border-radius: 8px; padding: 8px 10px; font-size: 13px; }
.era b { display: block; color: var(--accent); font-size: 14px; }
.timeline { position: relative; margin: 0; padding: 0 0 0 26px; list-style: none; }
.timeline::before { content: ""; position: absolute; left: 7px; top: 6px; bottom: 6px; width: 2px; background: var(--border); }
.timeline li { position: relative; margin-bottom: 16px; }
.timeline li::before { content: ""; position: absolute; left: -24px; top: 6px; width: 12px; height: 12px; border-radius: 50%;
  background: var(--surface); border: 3px solid var(--accent); }
.timeline .yr { font: 700 16px var(--mono); color: var(--accent); margin-right: 8px; }
.timeline .doc { font-size: 12.5px; color: var(--muted); }
</style>
</head>
<body class="history">
<main>
  <h1>History</h1>
  <p class="tag" id="tagline"></p>
  <form class="ask" id="ask"><input name="q" autocomplete="off" autofocus aria-label="History query"><button>Show timeline</button></form>
  <div class="chips" id="examples"></div>
  <div class="banner" id="banner" role="status"></div>
  <div class="layout">
    <section id="result"><div class="empty">Ask about a topic or a period to see its timeline.</div></section>
    <aside class="side">
      <div class="card"><h2>Sources</h2><div id="sources"></div></div>
      <div class="card"><h2>FQL used <span id="timing" class="small"></span></h2><div id="fql"></div></div>
    </aside>
  </div>
</main>
<script src="/static/common.js"></script>
<script>
const { el, highlight } = qb;

function render(res) {
  const out = document.getElementById("result");
  if (res.kind !== "timeline") { out.replaceChildren(el("div", { class: "empty" }, res.summary || "")); return; }
  const card = el("div", { class: "card" }, el("p", { class: "summary" }, res.summary));
  if (res.eras.length) card.append(el("div", { class: "eras" }, res.eras.map((e) =>
    el("div", { class: "era" }, el("b", {}, e.era), `${e.from === e.to ? e.from : e.from + " – " + e.to} · ${e.count} event${e.count > 1 ? "s" : ""}`))));
  if (res.events.length) card.append(el("ol", { class: "timeline" }, res.events.map((e) =>
    el("li", {}, el("span", { class: "yr" }, e.label), e.text, el("div", { class: "doc" }, e.title)))));
  else card.append(el("div", { class: "empty" }, "Nothing dated here yet — drop sources into the history inbox."));
  out.replaceChildren(card);
}
qb.domainPage({ key: "history", collection: "History", render });
</script>
</body>
</html>
